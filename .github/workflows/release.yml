name: Release

on:
  push:
    tags: ['v*']
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      publish_nightly:
        description: 'Publish rolling nightly release'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: prepare
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      EVENT_NAME: ${{ github.event_name }}
      REF: ${{ github.ref }}
      PUBLISH_NIGHTLY: ${{ inputs.publish_nightly }}
    steps:
      - name: Decide whether release build is needed
        id: decide
        run: |
          set -euo pipefail
          resolve_tag_sha() {
            local tag="$1"
            local obj_type obj_sha
            read -r obj_type obj_sha < <(
              gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '[.object.type, .object.sha] | @tsv' 2>/dev/null
            ) || return 1
            if [ "$obj_type" = tag ]; then
              gh api "repos/$GH_REPO/git/tags/$obj_sha" --jq '.object.sha' 2>/dev/null
            else
              printf '%s\n' "$obj_sha"
            fi
          }

          if [[ "$REF" == refs/tags/v* ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" = workflow_dispatch ] && [ "$PUBLISH_NIGHTLY" != true ]; then
            echo "Nightly publication disabled via workflow_dispatch input."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          main_sha=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          if [ "$main_sha" != "$GITHUB_SHA" ]; then
            echo "Skipping superseded nightly check for $GITHUB_SHA (main is at $main_sha)"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest_tag=$(gh api "repos/$GH_REPO/releases/latest" --jq '.tag_name // empty' 2>/dev/null || true)
          recent_tag=$(gh api "repos/$GH_REPO/releases?per_page=1" --jq '.[0].tag_name // empty' 2>/dev/null || true)
          for release_tag in "$latest_tag" "$recent_tag" nightly; do
            [ -n "$release_tag" ] || continue
            release_sha=$(resolve_tag_sha "$release_tag" || true)
            if [ "$release_sha" = "$GITHUB_SHA" ]; then
              echo "Skipping nightly build: release $release_tag already matches commit $GITHUB_SHA"
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "should_build=true" >> "$GITHUB_OUTPUT"

  build-release:
    name: build (${{ matrix.target }})
    needs: prepare
    timeout-minutes: 30
    if: needs.prepare.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add "$TARGET"
      - name: Build stripped release
        run: cargo build --release --locked --target "$TARGET"
      - name: Package executable and companion skills
        id: package
        run: |
          set -euo pipefail
          staging=$(mktemp -d)
          trap 'rm -rf "$staging"' EXIT
          cp "target/$TARGET/release/contextunity-forge-mcp" "$staging/"
          cp -R skills "$staging/skills"
          test -f "$staging/skills/install.sh"
          mkdir -p dist
          archive="contextunity-forge-mcp-$TARGET.tar.gz"
          tar -czf "dist/$archive" -C "$staging" contextunity-forge-mcp skills
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > SHA256SUMS
          else
            shasum -a 256 "$archive" > SHA256SUMS
          fi
      - name: Upload target package
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  publish:
    name: publish
    needs: [prepare, build-release]
    if: needs.prepare.outputs.should_build == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        if: github.ref_type == 'tag'
      - name: Download target packages separately
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
      - name: Assemble and verify release assets
        run: |
          set -euo pipefail
          mkdir dist
          for package in artifacts/release-*; do
            cp "$package"/*.tar.gz dist/
            cat "$package/SHA256SUMS" >> dist/SHA256SUMS
          done
          test "$(find dist -name '*.tar.gz' | wc -l)" -eq 4
          test "$(wc -l < dist/SHA256SUMS)" -eq 4
          cd dist
          sort -o SHA256SUMS SHA256SUMS
          sha256sum --check --strict SHA256SUMS
      - name: Publish tag or rolling nightly
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = tag ]; then
            tag="$REF_NAME"
            version="${tag#v}"
            notes_file=$(mktemp)
            trap 'rm -f "$notes_file"' EXIT
            python3 - "$version" "$notes_file" <<'PY'
          import pathlib, re, sys
          version, out_path = sys.argv[1], sys.argv[2]
          changelog = pathlib.Path("CHANGELOG.md")
          if changelog.is_file():
              text = changelog.read_text(encoding="utf-8")
              pattern = re.compile(rf"(?ms)^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)")
              match = pattern.search(text)
              if match and match.group(1).strip():
                  pathlib.Path(out_path).write_text(match.group(1).strip() + "\n", encoding="utf-8")
          PY
            if ! gh release view "$tag" >/dev/null 2>&1; then
              if [ -s "$notes_file" ]; then
                gh release create "$tag" --verify-tag --title "$tag" --notes-file "$notes_file"
              else
                gh release create "$tag" --verify-tag --title "$tag" --generate-notes
              fi
            fi
          else
            tag=nightly
            # A queued older main build must not replace a newer nightly.
            current=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
            if [ "$current" != "$GITHUB_SHA" ]; then
              echo "Skipping superseded nightly build $GITHUB_SHA"
              exit 0
            fi
            if ! gh release view nightly >/dev/null 2>&1; then
              gh release create nightly --target "$GITHUB_SHA" --title Nightly \
                --notes "Rolling build from main at $GITHUB_SHA" --prerelease --latest=false
            fi
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/nightly" \
              -f sha="$GITHUB_SHA" -F force=true
            gh release edit nightly --target "$GITHUB_SHA" --title Nightly \
              --notes "Rolling build from main at $GITHUB_SHA" --prerelease --latest=false
          fi
          gh release upload "$tag" dist/*.tar.gz dist/SHA256SUMS --clobber

# =============================================================================
# HIERARCHICAL ACDD PROFILE: Documentation Graph Refactor Workflow
#
# Aligned with: `agent-instructions` skill, Milestone 052/054 & ADR standards
# Goal: Refactor, reconcile, and consolidate documentation graphs, AGENTS.md,
#       and API references against live code and tests WITHOUT drift or code tampering.
# =============================================================================

version: 2

# =============================================================================
# 1. ROLES CATALOG (`roles`)
# =============================================================================
roles:
  docs_architect:
    mode: subagent
    reuse_on_reject: true
    models:
      - 'claude-opus-5.5'
      - 'gpt-6.1-sol:xhigh'

  docs_builder:
    mode: subagent
    reuse_on_reject: true
    models:
      - 'claude-opus-5.5'
      - 'gpt-6.1-sol:medium'

  docs_reviewer:
    mode: subagent
    reuse_on_reject: true
    models:
      - 'claude-opus-5.5'
      - 'gpt-6.1-sol:xhigh'

# =============================================================================
# 2. COMMANDS CATALOG (`commands`)
# =============================================================================
commands:
  scan_docs_graph_drift:
    command: "python3 -c 'import os, glob; [print(f) for f in glob.glob(\"docs/**/*.md\", recursive=True)]' > .forge/docs_inventory.txt"
    timeout_seconds: 30
    output: { require_counts: false }

  verify_no_code_tampering:
    # Documentation tasks are strictly bounded to docs/, skills/, and READMEs.
    # Any modification to production source or test files fails closed.
    command: "! git status --short | grep -E '(src/|tests/|crates/|app/|lib/)'"
    timeout_seconds: 15
    output: { require_counts: false }

  verify_markdown_links_and_anchors:
    command: "contextunity-forge-mcp docs check"
    timeout_seconds: 30
    output: { require_counts: false }

  verify_full_documentation_suite:
    command: "cargo test --doc"
    timeout_seconds: 60

# =============================================================================
# 3. POLICIES CATALOG (`policies`)
# =============================================================================
policies:
  docs_review_policy:
    independent_worker: true
    require_all_contours: true
    audit_extended_scope: true
    enforce_no_code_tampering: true
    enforce_clickable_file_links: true

  docs_delivery_policy:
    auto_commit: true
    enforce_clean_worktree: true

# =============================================================================
# 4. GUIDANCE CATALOG (`guidance`)
# =============================================================================
guidance:
  docs.drift_scan: >
    Scan target documentation against live code signatures, CLI flags, and YAML schemas.
    Identify dead document links, outdated symbol names, and missing invariant references (`INV-*`).
    Inventory all documents in scope before editing. If code bugs are found, route them to code owners
    via task blackboard notes; never silently edit code inside a documentation task.

  docs.reconcile_and_tighten: >
    Reconcile explanations with live production reality.
    Enforce concise, dense documentation following `agent-instructions` standards.
    Ensure all referenced files and symbols use clickable markdown links (`file:///...`).
    Keep invariant headers intact. Remove dead explanations and historical cruft.

  contour.link_integrity:
    description: "Verify that all markdown links, file:// links, and anchor fragments point to valid targets on disk."
    criteria:
      - "Check that every file:/// link exists on the filesystem."
      - "Verify all internal document anchors resolve."

  contour.symbol_parity:
    description: "Verify that every function, class, tool, and CLI argument described in docs matches live source code."
    criteria:
      - "Match documented CLI flags against CLI command definitions."
      - "Ensure code signatures and types match current codebase."

  contour.no_code_tampering:
    description: "Verify that the git diff contains zero changes to production source code or test suites."
    criteria:
      - "Confirm changes are strictly bounded to docs/, skills/, and markdown files."

  contour.instruction_clarity:
    description: "Verify that revised AGENTS.md, SKILL.md, or guides are unambiguous, actionable, and token-efficient."
    criteria:
      - "Check adherence to concise agent instruction guidelines."

# =============================================================================
# 5. GATES DEFINITION (`gates`)
# =============================================================================
gates:
  # ---------------------------------------------------------------------------
  # Gate 1: Contract & Drift Audit Gate (Agent)
  # ---------------------------------------------------------------------------
  - id: contract
    role: docs_architect
    proof: contract
    guidance:
      - docs.drift_scan

  # ---------------------------------------------------------------------------
  # Gate 2: Implementation Container Gate (Composite: Builder + Autonomous Verification)
  # ---------------------------------------------------------------------------
  - id: implement
    gates:
      # Step 2a: Documentation Builder edits Markdown files
      - id: write_docs
        role: docs_builder
        guidance:
          - docs.reconcile_and_tighten

      # Step 2b: Autonomous Command Guard - verify zero code touched
      - id: guard_code_untouched
        command: verify_no_code_tampering
        proof: command
        fail: write_docs

      # Step 2c: Autonomous Link and Anchor Verification
      - id: verify_links
        command: verify_markdown_links_and_anchors
        proof: command
        fail: write_docs
        save: snapshot

  # ---------------------------------------------------------------------------
  # Gate 3: Independent Cognitive Review (Agent)
  # ---------------------------------------------------------------------------
  - id: review
    role: docs_reviewer
    policy: docs_review_policy
    proof: review
    fail: implement

  # ---------------------------------------------------------------------------
  # Gate 4: Autonomous Delivery (Zero-Token Commit)
  # ---------------------------------------------------------------------------
  - id: deliver
    role: docs_reviewer
    proof: delivery
    receipt: true
    need:
      - review
    fail: implement
    save:
      immutable: true
      post: commit

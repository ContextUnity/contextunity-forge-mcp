[package]
name = "contextunity-forge-mcp"
version = "0.2.0"
edition = "2021"
authors = ["ContextUnity Team"]
description = "Pure Rust ContextUnity Forge MCP Server, Code Map and Documentation Engine"

[dependencies]
rmcp = { version = "3.4", features = ["transport-io", "schemars"] }
clap = { version = "4.5", features = ["derive", "env"] }
rusqlite = { version = "0.31", features = ["bundled", "modern_sqlite", "hooks", "limits"] }
tree-sitter = "0.22"
tree-sitter-python = "0.21"
tree-sitter-typescript = "0.21"
tree-sitter-javascript = "0.21"
tree-sitter-rust = "0.21"
tree-sitter-go = "0.21"
pulldown-cmark = { version = "0.10", default-features = false }
rayon = "1.10"
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "io-std", "sync", "fs"] }
ignore = "0.4"
walkdir = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
hex = "0.4"
hashbrown = { version = "0.14", features = ["rayon", "serde"] }
petgraph = "0.6"
dirs = "5.0"
libc = "0.2"
anyhow = "1.0"
schemars = "1.0"


[build-dependencies]
cc = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

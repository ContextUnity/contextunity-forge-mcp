# =============================================================================
# TEST WORKFLOW: Plan Model In-Place Execution & Archive E2E Verification
# Purpose: Autonomous verification of Model 2 (tasks container without root milestone gates).
# Invariants:
#   1. save: snapshot (captures in-flight state in refs/forge/snapshots/, NO auto-commits)
#   2. In-place execution on current branch without worktree spawning.
#   3. Zero root milestone gates (no blueprint_synthesis pre-task container, no handoff closure).
#   4. Archiving via `plan archive` relocates document and prunes SQLite + snapshot refs.
# =============================================================================

version: 2

save: snapshot

roles:
  builder:
    mode: subagent
    reuse_on_reject: true
    models:
      - 'gpt-6.1-sol:medium'

  independent_reviewer:
    mode: subagent
    reuse_on_reject: true
    models:
      - 'gpt-6.1-sol:xhigh'

commands:
  rust-check-and-test:
    command: "cargo clippy --all-targets --all-features -- -D warnings && cargo test"
    timeout_seconds: 180

policies:
  default_review:
    independent_worker: true
    require_all_contours: true

# Plan model topology: strictly the tasks: container
gates:
  - tasks:
      gates:
        - id: build
          role: builder
          command: rust-check-and-test
          proof: command
          save:
            pre: snapshot
            post: snapshot

        - id: review
          role: independent_reviewer
          policy: default_review
          independent_from: build
          fail: build
          save:
            immutable: true

        - id: deliver
          role: independent_reviewer
          receipt: true
          need:
            - review
          independent_from: build
          fail: build
          save:
            immutable: true
            post: snapshot

# =============================================================================
# TEST WORKFLOW: Milestone Full 3-Tier Lifecycle E2E Verification
# Purpose: Autonomous verification of Model 3 (blueprint_synthesis + tasks + closure).
# Invariants:
#   1. save: commit (atomic Git delivery commits with receipts in isolated worktrees).
#   2. Root pre-task container (blueprint_synthesis) executes ONCE before tasks.
#   3. Tasks execute in topological wave DAG order through their own task gates.
#   4. Root closure: autonomous zero-trust test gate `verify` executes `check_full_repo`.
#   5. Handoff prunes completed SQLite state and relocates manifest to archive.
# =============================================================================

version: 2
inherit: default

save: commit

commands:
  rust-check-and-test:
    command: "cargo clippy --all-targets --all-features -- -D warnings && cargo test"
    timeout_seconds: 180

  check_full_repo:
    command: "cargo test --test commitment_integrity && cargo clippy --all-targets --all-features -- -D warnings && cargo test --all-targets"
    timeout_seconds: 1800

gates:
  - tasks:
      gates:
        - id: build
          command: rust-check-and-test
        - id: seam
          when: seam
          gates:
            - id: integrate
              command: rust-check-and-test

  - id: verify
    command: check_full_repo

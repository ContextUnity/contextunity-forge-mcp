version: 2
inherit: default

commands:
  check-and-test:
    command: "cargo clippy {scope_target} --all-features -- -D warnings && cargo test {scope_target}"
    output: &test_output
      counts:
        passed: '(?m)\b(\d+) passed\b'
        failed: '(?m)\b(\d+) failed\b'
      require_counts: true
      noise: ['^\s*(Compiling|Downloading|Finished|Checking)\b', '^✔']
      errors: ['^error(\[E\d+\])?:', 'panicked at', '^FAIL ']
      tests:
        target: '(?m)(?:^\s*Running\s+(?:unittests\s+)?|"kind":\s*\[[^\]]*"test"[^\]]*\].*?"src_path":\s*"|--test\s+)([^\s"\\)]+)'
        passed: '(?m)^test\s+([A-Za-z0-9_:]+)\s+\.\.\.\s+ok\b'
        failed: '(?m)^test\s+([A-Za-z0-9_:]+)\s+\.\.\.\s+FAILED\b'
        ignored: '(?m)^test\s+([A-Za-z0-9_:]+)\s+\.\.\.\s+ignored\b'
    description: "Run strict Rust checks followed by the repository's test suite."
  rust-check-and-test:
    command: "cargo clippy {scope_target} --all-features -- -D warnings && cargo test {scope_target}"
    output: *test_output
    description: "Run strict Rust checks followed by the repository's test suite."
  check_full_repo:
    command: "cargo test --test commitment_integrity && cargo clippy --all-targets --all-features -- -D warnings && cargo test --all-targets"
    description: "Run the milestone handoff verification commands from TESTS.md."
    timeout_seconds: 1800
  test:
    command: "cargo test"
    description: "Run scoped tests for red contract proof."

scope_args_by_pattern:
  "src/main.rs": "--bin contextunity-forge-mcp"
  "src/**/*.rs": "--lib"
  "crates/forge-core/**/*.rs": "--package forge-core --lib"
  "crates/forge-index/**/*.rs": "--package forge-index --lib"
  "crates/forge-tasks/**/*.rs": "--package forge-tasks --lib"
  "tests/*.rs": "--test {file_stem}"
  "tests/acdd/**/*.rs": "--test acdd"
  "tests/common/**/*.rs": "--all-targets"
  "tests/commitment_integrity/**/*.rs": "--test commitment_integrity"
  "tests/core/**/*.rs": "--test core"
  "tests/framework_manifests/**/*.rs": "--test framework_manifests"
  "tests/incremental/**/*.rs": "--test incremental"
  "tests/languages/**/*.rs": "--test languages"
  "tests/linker/**/*.rs": "--test linker"
  "tests/mcp/**/*.rs": "--test mcp"
  "tests/mcp_context/**/*.rs": "--test mcp"
  "tests/query_context/**/*.rs": "--test query_context"
  "tests/receivers/**/*.rs": "--test linker"

gates:
  - tasks:
      gates:
        - id: contract
          command: test
        - id: build
          command: rust-check-and-test
        - id: seam
          gates:
            - id: integrate
              command: rust-check-and-test

  - id: verify
    command: check_full_repo

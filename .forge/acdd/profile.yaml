# Workspace override. Unspecified gates, commands, policies, and contours use
# the embedded defaults in src/core/tasks/acdd.default.yaml.
roles:
  contract_author:
    mode: subagent
    reuse_on_reject: true
    models:
      - 'sol-6.1:high'
    guidance: "As contract author, define the production-seam contract and red proof, then post a build-targeted draft for the builder."
  builder:
    mode: subagent
    reuse_on_reject: true
    models:
      - 'gpt6-luna:xhigh'
    guidance: "Implement the approved contract inside the declared allowed_write_scope and verify tests."
  independent_reviewer:
    mode: subagent
    reuse_on_reject: true
    models:
      - 'sol-6.1:xhigh'
    guidance: "Use a reviewer worker independent from the builder. Submit review proof across contours, then claim and submit deliver in the same reviewer session."

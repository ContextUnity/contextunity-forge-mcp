version: 2

limits:
  max_metadata_bytes: 2048
  max_trace_summary_bytes: 2048

git_commit_note:
  limits:
    max_bytes: 2048
  format: markdown
  telemetry:
    format: markdown
    sections:
      - duration: true
      - tasks_summary: true
      - review_cycles: true
      - diff_breakdown: true
      - ast_delta: true
      - test_suite: true
      - topology: true

roles:
  contract_author:
    mode: subagent
    reuse_on_reject: true
    models:
      - 'sol-6.1:high'
    guidance: "As contract author, lead architectural synthesis and implementation planning before writing tests. Do not reduce contracts to quick failing tests. Synthesize a concrete architectural plan: trace data flow, define typed invariants, specify negative boundaries, and establish compiling runtime-red seam tests (exit code 101) as executable proof of the architecture. For existing capabilities, extend table-driven cases additively; for distinct capabilities or contract boundaries, author dedicated, descriptively-named test functions. Never accumulate unrelated scenarios into monolithic test functions. Never modify protected files (Cargo.toml, build.rs, .forge/**). Post the build-targeted architectural draft to task_blackboard."

  builder:
    mode: subagent
    reuse_on_reject: true
    models:
      - 'gpt6-luna:xhigh'
    guidance: "Implement the approved contract inside the declared allowed_write_scope and verify tests."

  independent_reviewer:
    mode: subagent
    reuse_on_reject: true
    models:
      - 'sol-6.1:xhigh'
    guidance: "Use a reviewer worker independent from the builder. Conduct a broad architectural audit and check against performance.md. Treat review contours as analytical guidance rather than rigid checkboxes. Reject superficial workarounds, ad-hoc string heuristics (e.g. path shape guesses, magic substring checks), parallel hardcoded lists, or patches designed merely to appease a test. Reject implementations that dump tests into monolithic functions instead of domain-decomposed tests. If an implementation requires repeated duct-tape fixes across review rounds, reject the architecture and require root-cause redesign. Formulate findings constructively without blocking beneficial optimizations. Submit review proof across contours, then claim and submit deliver in the same reviewer session."

  architect:
    mode: subagent
    reuse_on_reject: true
    models:
      - 'sol-6.1:high'
    guidance: "As Architect, lead architectural contract synthesis and arbitration. Conduct a comprehensive architectural audit of codebase extension points and subsystem data flows before coding. Ensure task contracts define durable architectural blueprints, invariant specifications, and implementation steps, where tests serve as verification seams. Verify scope integrity without touching Cargo.toml or build.rs. Define cross-task seam contracts, establish compiling red tests (exit 101), and record architectural decisions on task_blackboard."

guidance:
  milestone.synthesis:
    description: "MANDATORY ARCHITECTURAL AUDIT & CONTRACT SYNTHESIS GATE — DO NOT BYPASS"
    criteria:
      - "NO DEAD RE-EXPORT SHIMS: Do not retain pub mod wrappers when pub use crate_name::module; suffices."
      - "CRATE EXTRACTION CLEANUP: Check git status and module-tree reachability after extraction; delete orphaned source files inside admitted scope."
      - "AST SEARCH LANGUAGE: Always supply language to ast_grep_search when path is omitted or has no file extension, including directory paths."
      - "REVIEW REJECTION BOUNDARY: Reject only for contract failure, scope violation, invariant breach, or a genuine functional or architectural defect. Never reject over doc-comment wording or non-regression stylistic nitpicks."
      - "ARCHITECTURAL EXTENSION POINTS: Inspect existing parser and linker registries using code_map_* and ctx_read. Identify natural extension seams and data flow. Do NOT invent parallel systems or touch protected files (Cargo.toml, build.rs, .forge/**)."
      - "FORMAL ARCHITECTURAL BLUEPRINT: Synthesize an architectural decision covering type invariants, data flow, error states, and impact perimeters."
      - "DOMAIN SEAM TEST: Author a compiling runtime-red seam test in the appropriate domain test module (in tests/) proving the unfulfilled contract. Author dedicated test functions with descriptive names rather than appending to monolithic test functions."
      - "RECORD ARCHITECTURAL DECISION: Before submitting this gate, post an explicit synthesis decision to task_blackboard (topic: decisions) detailing the chosen implementation path."
      - "ANTI-AUTOPILOT INVARIANT: Do NOT blindly submit a failing test without completing the architectural audit and posting the decision to the blackboard."

  task.contract:
    description: "PRODUCTION-SEAM CONTRACT AUTHORING & RUNTIME-RED PROOF"
    criteria:
      - "ARCHITECTURAL BLUEPRINT & PLAN: Contract synthesis is an architectural planning phase, NOT merely authoring a failing test. Before writing code, analyze subsystem data flow, define typed invariants, document negative boundaries, and lay out the implementation steps."
      - "SEAM VERIFICATION AS ARCHITECTURAL PROOF: The red seam test is the executable proof of the architectural contract. Ensure it compiles cleanly and fails at runtime on assertions (exit code 101) for contract gate proof."
      - "PARAMETERIZED EXPANSION VS DEDICATED DOMAIN TESTS: Add parameterized test cases (e.g. table rows) ONLY when expanding input permutations for the same unit/capability. When testing distinct capabilities, tasks, or invariants, author separate, descriptively-named test functions in the appropriate domain module. NEVER accumulate unrelated subtask scenarios or review fixes into a monolithic test function."
      - "MINIMAL INTERVENTION: Avoid duplicate mechanisms, redundant wrapper tables, or shadow registries when existing seams can be cleanly extended."
      - "SCOPE INTEGRITY: Never touch protected files (Cargo.toml, build.rs, .forge/**) or expand scope outside admitted task perimeter."

  task.review:
    description: "INDEPENDENT REVIEW CORE INVARIANTS & ENGINEERING PRINCIPLES"
    criteria:
      - "NO DEAD RE-EXPORT SHIMS: Do not retain pub mod wrappers when pub use crate_name::module; suffices."
      - "CRATE EXTRACTION CLEANUP: Check git status and module-tree reachability after extraction; delete orphaned source files inside admitted scope."
      - "AST SEARCH LANGUAGE: Always supply language to ast_grep_search when path is omitted or has no file extension, including directory paths."
      - "REVIEW REJECTION BOUNDARY: Reject only for contract failure, scope violation, invariant breach, or a genuine functional or architectural defect. Never reject over doc-comment wording or non-regression stylistic nitpicks."
      - "BROAD ARCHITECTURAL EXPLORATION: Never evaluate diffs in isolation. Thoroughly inspect subsystem integration and extension points using Forge MCP (code_map_inspect, code_map_impact, ast_grep_search, code_map_overview) and ctx_read."
      - "STRICT REJECTION OF HACKS & HEURISTICS: Actively detect and REJECT superficial workarounds, ad-hoc string heuristics (e.g. path shape guesses, magical substring checks), hardcoded parallel lookup lists, or patches designed merely to turn a test green. Require durable, authentic root-cause fixes in the typed data model."
      - "TEST HYGIENE & ANTI-MONOLITH: Reject diffs that append tests, review probes, or heavy integration fixtures into existing unit test functions. Enforce domain decomposition into focused, parallelizable test functions."
      - "ANTI-LOOPING & ARCHITECTURAL RE-EVALUATION: If an implementation fails repeatedly across review rounds or accumulates layers of duct tape, do NOT accept another patch. Reject the implementation, diagnose the defective contract, and require architectural re-synthesis."
      - "MANDATORY PERFORMANCE ALIGNMENT: Read docs/architecture/performance.md before reviewing. Verify zero performance regressions: single-pass reads, zero duplicate fact caches, avoiding nested Rayon overhead, lean details, and minimal heap allocations."
      - "CONSTRUCTIVE FINDINGS: Formulate findings constructively with actionable criteria. Do not weaponize minor terminology mismatches to block genuine optimizations."
      - "CONTOURS AS GUIDING RECOMMENDATIONS: Treat the 5 review contours (paths, claims, concurrency, project_isolation, administration) as an analytical evaluation framework, not rigid bureaucratic checkboxes."

  milestone.review:
    description: "MILESTONE INTEGRATION REVIEW & BOUNDED VERIFICATION"
    criteria:
      - "NO DEAD RE-EXPORT SHIMS: Do not retain pub mod wrappers when pub use crate_name::module; suffices."
      - "CRATE EXTRACTION CLEANUP: Check git status and module-tree reachability after extraction; delete orphaned source files inside admitted scope."
      - "AST SEARCH LANGUAGE: Always supply language to ast_grep_search when path is omitted or has no file extension, including directory paths."
      - "REVIEW REJECTION BOUNDARY: Reject only for contract failure, scope violation, invariant breach, or a genuine functional or architectural defect. Never reject over doc-comment wording or non-regression stylistic nitpicks."
      - "SYSTEM-LEVEL COHESION: Review overall milestone diff against target base for holistic architecture alignment, zero dangling abstractions, and clean module boundaries."
      - "PERFORMANCE INVARIANTS: Verify full alignment with docs/architecture/performance.md with authentic benchmark proof and no memory or latency regressions."
      - "CONSTRUCTIVE & DURABLE: Enforce authentic root-cause fixes; reject superficial workarounds or duplicate mechanisms without blocking beneficial improvements."
      - "ANALYTICAL CONTOURS: Evaluate review contours with engineering judgment as guiding recommendations rather than rigid bureaucratic checkboxes."

commands:
  rust-check-and-test:
    command: "cargo clippy --all-targets --all-features -- -D warnings && cargo test"
    description: "Run strict Rust checks followed by the repository's test suite."
    scope_args_by_pattern:
      "src/main.rs": "--bin contextunity-forge-mcp"
      "src/**/*.rs": "--lib"
      "crates/forge-core/**/*.rs": "--package forge-core --lib"
      "crates/forge-index/**/*.rs": "--package forge-index --lib"
      "crates/forge-tasks/**/*.rs": "--package forge-tasks --lib"
      "tests/*.rs": "--test {file_stem}"
      "tests/acdd/**/*.rs": "--test acdd"
      "tests/common/**/*.rs": "--all-targets"
      "tests/commitment_integrity/**/*.rs": "--test commitment_integrity"
      "tests/core/**/*.rs": "--test core"
      "tests/framework_manifests/**/*.rs": "--test framework_manifests"
      "tests/incremental/**/*.rs": "--test incremental"
      "tests/languages/**/*.rs": "--test languages"
      "tests/linker/**/*.rs": "--test linker"
      "tests/mcp/**/*.rs": "--test mcp"
      "tests/mcp_context/**/*.rs": "--test mcp"
      "tests/query_context/**/*.rs": "--test query_context"
      "tests/receivers/**/*.rs": "--test linker"
  check_full_repo:
    command: "cargo test --test commitment_integrity && cargo clippy --all-targets --all-features -- -D warnings && cargo test --all-targets"
    description: "Run the milestone handoff verification commands from TESTS.md."
    timeout_seconds: 1800
  test:
    command: "cargo test"
    description: "Compatibility command for legacy task evidence."

policies:
  default_review:
    independent_worker: true
    require_all_contours: true
    audit_extended_scope: true

gate_templates:
  build_review_cycle:
    gates:
      - id: build
        role: architect
        proof: none
      - id: verify
        command: check_full_repo
        proof: command
      - id: review
        role: independent_reviewer
        proof: review
        independent_from: build
        contours: guidance.contours

gates:
  - id: contract_synthesis
    role: architect
    guidance: [milestone.synthesis, hitl]
    tools:
      - code_map_inspect
      - code_map_impact
      - code_map_overview
      - code_map_search
      - ast_grep_search
      - task_blackboard
    steps:
      - "1. ARCHITECTURAL AUDIT: Inspect existing codebase extension points using code_map_* and ctx_read. Do NOT assume Tree-sitter or Cargo.toml changes are needed."
      - "2. SCOPE VERIFICATION: Verify all implementation files are inside allowed_write_scope. Protected files (Cargo.toml, build.rs) must NOT be edited."
      - "3. SEAM TEST: Strengthen existing domain seam tests additively in tests/ with a cleanly compiling test that triggers runtime assertion failure (exit 101)."
      - "4. BLACKBOARD RECORD: Post architectural synthesis decision to task_blackboard (topic: decisions) detailing the chosen implementation path."
      - "5. SUBMIT: Submit contract proof with seam_test_ref and red_exit_code: 101."
    proof: contract
    expected_failure:
      exit_codes: [1, 101, 134]
      stderr_contains: "assertion failed"
    persistence:
      pre: snapshot
      post: commit

  - tasks:
      gates:
        - id: contract
          role: contract_author
          tools: [get_code_snippet, search_docs, get_doc]
          guidance: [task.contract, hitl.pro]
          proof: contract
          expected_failure:
            exit_codes: [1, 101, 134]
            stderr_contains: "assertion failed"
          persistence:
            post: snapshot

        - id: build
          role: builder
          tools: [get_code_snippet, search_docs, get_doc]
          guidance: [task.code, hitl.pro]
          command: rust-check-and-test
          proof: command
          persistence:
            pre: snapshot
            post: snapshot

        - id: review
          role: independent_reviewer
          tools: [get_code_snippet, search_docs, get_doc]
          guidance: [task.review, hitl.pro]
          policy: default_review
          proof: review
          contours: guidance.contours
          independent_from: build
          reject_to: build
          reject_routing:
            scope: build
            symbols: contract
          persistence:
            immutable: true

        - id: seam
          when: seam
          gates:
            - id: integrate
              role: builder
              command: rust-check-and-test
              proof: seam_test
              persistence:
                pre: snapshot
                post: snapshot
            - id: review
              role: independent_reviewer
              proof: review
              contours: guidance.contours
              independent_from: integrate
              reject_to: integrate
              reject_routing:
                scope: integrate
                symbols: contract
              persistence:
                immutable: true

        - id: deliver
          role: independent_reviewer
          guidance: [hitl.pro]
          proof: delivery
          receipt: true
          review_sources:
            - review
          independent_from: build
          reject_to: build
          persistence:
            immutable: true
            post: commit
            git_commit_note: telemetry

milestone_verification:
  id: milestone_verification
  gates:
    - id: verify
      command: check_full_repo
      proof: command
    - id: review
      role: independent_reviewer
      policy: default_review
      guidance: [milestone.review]
      proof: review
      contours: guidance.contours
      independent_from: verify
      persistence:
        immutable: true
  fallback:
    use: build_review_cycle
    command: check_full_repo
    guidance: [milestone.polish]
    max_attempts: 2
  deliver:
    proof: delivery
    receipt: true
    persistence:
      immutable: true
      post: commit

version: 2

limits:
  max_metadata_bytes: 2048
  max_trace_summary_bytes: 2048

git_commit_note:
  limits:
    max_bytes: 2048
  format: markdown
  telemetry:
    format: markdown
    sections:
      - duration: true
      - tasks_summary: true
      - review_cycles: true
      - diff_breakdown: true
      - ast_delta: true
      - test_suite: true
      - topology: true

roles:
  contract_author:
    mode: subagent
    reuse_on_reject: true
    models:
      - 'sol-6.1:high'
    guidance: "As contract author, define the production-seam contract and runtime-red proof (exit code 101). For existing capabilities, extend existing domain seam tests additively and subsume weaker duplicates; author new tests only for greenfield boundaries with compiling production stubs. Post a build-targeted draft for the builder."

  builder:
    mode: subagent
    reuse_on_reject: true
    models:
      - 'gpt6-luna:xhigh'
    guidance: "Implement the approved contract inside the declared allowed_write_scope and verify tests."

  independent_reviewer:
    mode: subagent
    reuse_on_reject: true
    models:
      - 'sol-6.1:xhigh'
    guidance: "Use a reviewer worker independent from the builder. Submit review proof across contours, then claim and submit deliver in the same reviewer session."

  architect:
    mode: subagent
    reuse_on_reject: true
    models:
      - 'sol-6.1:high'
    guidance: "As Architect, lead architectural contract synthesis and arbitration. You MUST perform a thorough architectural audit of codebase extension points before coding. Verify that task scopes are sufficient without touching Cargo.toml or build.rs. Define cross-task seam contracts, establish compiling red tests (exit 101), and record architectural decisions on task_blackboard."

guidance:
  milestone.synthesis:
    description: "MANDATORY ARCHITECTURAL AUDIT & CONTRACT SYNTHESIS GATE — DO NOT BYPASS"
    criteria:
      - "ARCHITECTURAL EXTENSION POINTS: Inspect existing parser and linker registries using code_map_* and ctx_read. For languages, inspect src/engine/languages/mod.rs. Do NOT invent new Tree-sitter Cargo features or attempt to edit Cargo.toml."
      - "SCOPE & PERIMETER VERIFICATION: Confirm that all planned files are within task allowed_write_scope. Protected files (Cargo.toml, build.rs, .forge/**) are strictly off-limits. If an approach requires Cargo.toml, reject that approach immediately in favor of internal registries."
      - "SEAM CONTRACT & BASELINE: Author an additive domain seam test in tests/languages/extractors.rs that compiles cleanly and proves the red baseline (exit code 101)."
      - "RECORD ARCHITECTURAL DECISION: Before submitting this gate, post an explicit synthesis decision to task_blackboard (topic: decisions) detailing the chosen implementation path."
      - "ANTI-AUTOPILOT INVARIANT: Do NOT blindly submit a failing test without completing the architectural audit and posting the decision to the blackboard."

commands:
  rust-check-and-test:
    command: "cargo clippy --all-targets --all-features -- -D warnings && cargo test"
    description: "Run strict Rust checks followed by the repository's test suite."
    scope_args_by_pattern:
      "src/main.rs": "--bin contextunity-forge-mcp"
      "src/**/*.rs": "--lib"
      "tests/*.rs": "--test {file_stem}"
      "tests/acdd/**/*.rs": "--test acdd"
      "tests/common/**/*.rs": "--all-targets"
      "tests/commitment_integrity/**/*.rs": "--test commitment_integrity"
      "tests/core/**/*.rs": "--test core"
      "tests/incremental/**/*.rs": "--test incremental"
      "tests/languages/**/*.rs": "--test languages"
      "tests/linker/**/*.rs": "--test linker"
      "tests/mcp/**/*.rs": "--test mcp"
      "tests/mcp_context/**/*.rs": "--test mcp"
      "tests/query_context/**/*.rs": "--test query_context"
      "tests/receivers/**/*.rs": "--test linker"
  check_full_repo:
    command: "cargo test --test commitment_integrity && cargo clippy --all-targets --all-features -- -D warnings && cargo test --all-targets"
    description: "Run the milestone handoff verification commands from TESTS.md."
    timeout_seconds: 1800
  test:
    command: "cargo test"
    description: "Compatibility command for legacy task evidence."

policies:
  default_review:
    independent_worker: true
    require_all_contours: true
    audit_extended_scope: true

gate_templates:
  build_review_cycle:
    gates:
      - id: build
        role: architect
        proof: none
      - id: verify
        command: check_full_repo
        proof: command
      - id: review
        role: independent_reviewer
        proof: review
        independent_from: build
        contours: guidance.contours

gates:
  - id: contract_synthesis
    role: architect
    guidance: [milestone.synthesis, hitl]
    tools:
      - code_map_inspect
      - code_map_impact
      - code_map_overview
      - code_map_search
      - ast_grep_search
      - task_blackboard
    steps:
      - "1. ARCHITECTURAL AUDIT: Inspect existing codebase extension points using code_map_* and ctx_read. Do NOT assume Tree-sitter or Cargo.toml changes are needed."
      - "2. SCOPE VERIFICATION: Verify all implementation files are inside allowed_write_scope. Protected files (Cargo.toml, build.rs) must NOT be edited."
      - "3. SEAM TEST: Strengthen existing domain seam tests additively in tests/ with a cleanly compiling test that triggers runtime assertion failure (exit 101)."
      - "4. BLACKBOARD RECORD: Post architectural synthesis decision to task_blackboard (topic: decisions) detailing the chosen implementation path."
      - "5. SUBMIT: Submit contract proof with seam_test_ref and red_exit_code: 101."
    proof: contract
    expected_failure:
      exit_codes: [1, 101, 134]
      stderr_contains: "assertion failed"
    persistence:
      pre: snapshot
      post: commit

  - tasks:
      gates:
        - id: contract
          role: contract_author
          guidance: [task.contract, hitl.pro]
          proof: contract
          expected_failure:
            exit_codes: [1, 101, 134]
            stderr_contains: "assertion failed"
          persistence:
            post: snapshot

        - id: build
          role: builder
          guidance: [task.code, hitl.pro]
          command: rust-check-and-test
          proof: command
          persistence:
            pre: snapshot
            post: snapshot

        - id: review
          role: independent_reviewer
          guidance: [task.review, hitl.pro]
          policy: default_review
          proof: review
          contours: guidance.contours
          independent_from: build
          reject_to: build
          reject_routing:
            scope: build
            symbols: contract
          persistence:
            immutable: true

        - id: seam
          when: seam
          gates:
            - id: integrate
              role: builder
              command: rust-check-and-test
              proof: seam_test
              persistence:
                pre: snapshot
                post: snapshot
            - id: review
              role: independent_reviewer
              proof: review
              contours: guidance.contours
              independent_from: integrate
              reject_to: integrate
              reject_routing:
                scope: integrate
                symbols: contract
              persistence:
                immutable: true

        - id: deliver
          role: independent_reviewer
          guidance: [hitl.pro]
          proof: delivery
          receipt: true
          review_sources:
            - review
          independent_from: build
          reject_to: build
          persistence:
            immutable: true
            post: commit
            git_commit_note: telemetry

milestone_verification:
  id: milestone_verification
  gates:
    - id: verify
      command: check_full_repo
      proof: command
    - id: review
      role: independent_reviewer
      policy: default_review
      guidance: [milestone.review]
      proof: review
      contours: guidance.contours
      independent_from: verify
      persistence:
        immutable: true
  fallback:
    use: build_review_cycle
    command: check_full_repo
    guidance: [milestone.polish]
    max_attempts: 2
  deliver:
    proof: delivery
    receipt: true
    persistence:
      immutable: true
      post: commit

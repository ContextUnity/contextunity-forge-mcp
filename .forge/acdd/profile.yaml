# Workspace override. Unspecified gates, commands, policies, and contours use
# the embedded defaults in src/core/tasks/acdd.default.yaml.
roles:
  builder:
    models:
      - 'gpt6-luna:xhigh'
  independent_reviewer:
    mode: subagent
    reuse_on_reject: true
    models:
      - 'sol-6.1:high'
    guidance: "Use a reviewer worker that is independent from the task builder."

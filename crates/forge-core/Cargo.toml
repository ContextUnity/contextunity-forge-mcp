[package]
name = "forge-core"
version = "0.4.0"
edition = "2021"
description = "Pure Rust ContextUnity Forge domain models, interner, commitments, and config"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }

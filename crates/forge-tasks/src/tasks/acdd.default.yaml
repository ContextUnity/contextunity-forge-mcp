version: 2

limits:
  max_metadata_bytes: 2048
  max_trace_summary_bytes: 2048
  diagnostic_inline_bytes: 4096
  max_command_timeout_seconds: 1800

git_commit_note:
  limits:
    max_bytes: 2048
  format: markdown
  telemetry:
    format: markdown
    sections:
      - duration: true
      - tasks_summary: true
      - review_cycles: true
      - diff_breakdown: true
      - ast_delta: true
      - test_suite: true
      - topology: true

proofs:
  contract:
    description: "Proof of runtime assertion failure (exit 101/1/134) proving red seam baseline"
    schema:
      type: object
      required: [contract_proof]
      properties:
        contract_proof:
          type: object
          required: [seam_test_ref, red_exit_code]
          properties:
            seam_test_ref: { type: string }
            red_exit_code: { type: integer }

  command:
    description: "Autonomous command execution proof (exit code 0, passed linters/tests)"
    schema:
      type: object
      required: [command_proof]
      properties:
        command_proof:
          type: object
          required: [command, exit_code]
          properties:
            command: { type: string }
            exit_code: { type: integer, const: 0 }
            tests_passed: { type: integer }
            tests_failed: { type: integer, const: 0 }

  review:
    description: "Independent cognitive review sign-off across focus lenses"
    schema:
      type: object
      required: [review_proof]
      properties:
        review_proof:
          type: object
          required: [decision, contours]
          properties:
            decision: { type: string, enum: ["pass", "reject"] }
            contours: { type: object }
            extended_scope_review:
              type: object
              properties:
                approved_paths: { type: array, items: { type: string } }
                reason_verified: { type: boolean }
            notes: { type: string }

  seam_test:
    description: "Joint seam integration proof verifying all referenced cross-task tests passed"
    schema:
      type: object
      required: [seam_test_proof]
      properties:
        seam_test_proof:
          type: object
          required: [exit_code, seam_test_refs]
          properties:
            exit_code: { type: integer, const: 0 }
            seam_test_refs: { type: array, items: { type: string } }
            tests_passed: { type: integer }
            tests_failed: { type: integer, const: 0 }

  delivery:
    description: "Autonomous delivery receipt and atomic Git commit proof"
    schema:
      type: object
      required: [delivery_proof]
      properties:
        delivery_proof:
          type: object
          properties:
            status: { type: string }
            delivered: { type: boolean }
            commit_sha: { type: string }
            receipt_id: { type: string }

roles:
  contract_author:
    mode: subagent
    reuse_on_reject: true
    models:
      - 'sol-6.1:high'
    guidance: "As contract author, lead architectural synthesis and implementation planning before writing tests. Do not reduce contracts to quick failing tests. Synthesize a concrete architectural plan: trace data flow, define typed invariants, specify negative boundaries, and establish compiling runtime-red seam tests (exit code 101/1/134) as executable proof of the architecture. For existing capabilities, extend table-driven cases additively; for distinct capabilities or contract boundaries, author dedicated, descriptively-named test functions. Never accumulate unrelated scenarios into monolithic test functions. Never modify protected files. Post a build-targeted draft for the builder."
  builder:
    mode: subagent
    reuse_on_reject: true
    models:
      - 'gpt6-luna:xhigh'
    guidance: "Implement the approved contract inside the declared allowed_write_scope and verify tests."
  independent_reviewer:
    mode: subagent
    reuse_on_reject: true
    models:
      - 'sol-6.1:xhigh'
    guidance: "Use a reviewer worker independent from the builder. Conduct a broad architectural audit and verify performance and quality invariants. Reject superficial workarounds, ad-hoc string heuristics (e.g. magic substring/path checks), parallel hardcoded lists, or patches designed merely to appease a test. Reject implementations that dump tests into monolithic functions instead of domain-decomposed tests. If an implementation requires repeated duct-tape fixes across review rounds, reject the architecture and require root-cause redesign. Submit review proof across contours, then claim and submit deliver in the same reviewer session."
  architect:
    mode: subagent
    reuse_on_reject: true
    models:
      - 'sol-6.1:high'
    guidance: "As Architect, lead architectural contract synthesis and arbitration. Conduct a comprehensive architectural audit of codebase extension points and subsystem data flows before coding. Ensure task contracts define durable architectural blueprints, invariant specifications, and implementation steps, where tests serve as verification seams. Verify scope integrity without touching protected repository files. Establish compiling red tests and record explicit architectural decisions for the implementation plan."

scope_args_by_pattern:
  "crates/forge-core/**/*.rs": "--package forge-core --lib"
  "crates/forge-index/**/*.rs": "--package forge-index --lib"
  "crates/forge-tasks/**/*.rs": "--package forge-tasks --lib"
  "tests/framework_manifests/**/*.rs": "--test framework_manifests"

commands:
  rust-check-and-test:
    output: &test_output
      counts:
        passed: '(?m)\b(\d+) passed\b'
        failed: '(?m)\b(\d+) failed\b'
      require_counts: true
      noise: ['^\s*(Compiling|Downloading|Finished|Checking)\b', '^✔']
      errors: ['^error(\[E\d+\])?:', 'panicked at', '^FAIL ']
      seam_ref_pattern: '(?:--seam-ref\s+)(\S+)'
    by_pattern:
      "**/*.rs": "cargo clippy --all-targets --all-features -- -D warnings && cargo test"
    description: "Run strict Rust checks followed by the repository's test suite. Append --test <target> to focus the test command."
  check_full_repo:
    output: *test_output
    by_pattern:
      "**/*.py": "pytest"
      "**/*.{ts,tsx,vue}": "npm test"
      "**/*.rs": "cargo test --test commitment_integrity && cargo clippy --all-targets --all-features -- -D warnings && cargo test --all-targets"
    description: "Run the milestone handoff verification commands from TESTS.md."
    timeout_seconds: 600
  test:
    output: *test_output
    by_pattern:
      "**/*.rs": "cargo test"
    description: "Compatibility command for legacy task evidence; workflow guidance selects rust-check-and-test."

guidance:
  task.contract:
    description: "PRODUCTION-SEAM CONTRACT AUTHORING & RUNTIME-RED PROOF"
    criteria:
      - "ARCHITECTURAL BLUEPRINT & PLAN: Contract synthesis is an architectural planning phase, NOT merely authoring a failing test. Before writing code, analyze subsystem data flow, define typed invariants, document negative boundaries, and lay out the implementation steps."
      - "SEAM VERIFICATION AS ARCHITECTURAL PROOF: The red seam test is the executable proof of the architectural contract. Ensure it compiles cleanly and fails at runtime on assertions (exit code 101/1/134) for contract gate proof."
      - "PARAMETERIZED EXPANSION VS DEDICATED DOMAIN TESTS: Add parameterized test cases (e.g. table rows) ONLY when expanding input permutations for the same unit/capability. When testing distinct capabilities, tasks, or invariants, author separate, descriptively-named test functions in the appropriate domain module. NEVER accumulate unrelated subtask scenarios or review fixes into a monolithic test function."
      - "MINIMAL INTERVENTION: Avoid duplicate mechanisms, redundant wrapper tables, or shadow registries when existing seams can be cleanly extended."
      - "SCOPE INTEGRITY: Never touch protected repository files or expand scope outside admitted task perimeter."
  task.code: "Implement the accepted seam with the smallest change that satisfies the task contract."
  task.review:
    description: "INDEPENDENT REVIEW CORE INVARIANTS & ENGINEERING PRINCIPLES"
    criteria:
      - "NO DEAD RE-EXPORT SHIMS: Do not retain pub mod wrappers when pub use crate_name::module; suffices."
      - "CRATE EXTRACTION CLEANUP: Check git status and module-tree reachability after extraction; delete orphaned source files inside admitted scope."
      - "AST SEARCH LANGUAGE: Always supply language to ast_grep_search when path is omitted or has no file extension, including directory paths."
      - "REVIEW REJECTION BOUNDARY: Reject only for contract failure, scope violation, invariant breach, or a genuine functional or architectural defect. Never reject over doc-comment wording or non-regression stylistic nitpicks."
      - "BROAD ARCHITECTURAL EXPLORATION: Never evaluate diffs in isolation. Thoroughly inspect subsystem integration and extension points using semantic tools and source inspection."
      - "STRICT REJECTION OF HACKS & HEURISTICS: Actively detect and REJECT superficial workarounds, ad-hoc string heuristics (e.g. path shape guesses, magical substring checks), hardcoded parallel lookup lists, or patches designed merely to turn a test green. Require durable, authentic root-cause fixes in the typed data model."
      - "TEST HYGIENE & ANTI-MONOLITH: Reject diffs that append tests, review probes, or heavy integration fixtures into existing unit test functions. Enforce domain decomposition into focused, parallelizable test functions."
      - "ANTI-LOOPING & ARCHITECTURAL RE-EVALUATION: If an implementation fails repeatedly across review rounds or accumulates layers of duct tape, do NOT accept another patch. Reject the implementation, diagnose the defective contract, and require architectural re-synthesis."
      - "MANDATORY PERFORMANCE ALIGNMENT: Verify zero performance regressions: single-pass algorithms, zero duplicate caches, minimal heap allocations, and lean data structures."
      - "CONSTRUCTIVE FINDINGS: Formulate findings constructively with actionable criteria. Do not weaponize minor terminology mismatches to block genuine optimizations."
      - "CONTOURS AS GUIDING RECOMMENDATIONS: Treat the 5 review contours (paths, claims, concurrency, project_isolation, administration) as an analytical evaluation framework, not rigid bureaucratic checkboxes."
  task.deferred_final_test: "Run the registered verification command and submit passing seam test proof."
  task.seam_review: "Review joint seam changes across interdependent tasks."
  hitl.careless: "HITL level CARELESS: allow autonomous contract and implementation changes; escalate only for unrecoverable infrastructure or circular milestone dependencies."
  hitl.curious: "HITL level CURIOUS: report interface evolution as telemetry; escalate breaking public APIs, irreversible storage changes, or new external dependencies."
  hitl.pro: "HITL level PRO: allow internal helpers and non-breaking implementation changes; escalate public APIs, CLI/MCP surfaces, storage schemas, and cross-milestone contracts."
  hitl.paranoic: "HITL level PARANOIC: require explicit human approval for every new symbol or signature before contract admission."
  subtask.dod:
    description: "Definition of done for all subtasks"
    criteria:
      - "Contract slice resolution: Demonstrably resolves an explicit, bounded slice of the contract without breaking boundaries."
      - "Milestone & ADR alignment: Builds upon and strengthens existing architectural and test seams rather than authoring isolated patches or duplicate test functions."
      - "Production-seam evidence: Validates through real production paths rather than synthetic stubs mocking away system complexity."
      - "Systemic non-regression: Zero warnings/lints and complete behavioral preservation of untouched invariants."
      - "Anti-looping invariant: If an approach fails after 2 iterations, halt, post blockers to task_blackboard, retain fail-closed behavior, and escalate."
  review.policy:
    description: "Defect routing and scope boundaries for review gates"
    criteria:
      - "Route adjacent defects to their owning task or admit scope before edits; record deferred findings durably before delivery."
      - "Reviewers must accept legitimate defect fixes and verify changes against the declared scope (preventing uncontracted scope creep or overengineering)."
  contour.paths:
    description: "Verify changes stay within the task's admitted write perimeter and preserve protected paths."
    criteria:
      - "Compare every changed, staged, untracked, and generated file with the task's initial scope and admitted extensions."
      - "Check that profile, repository configuration, credentials, generated state, and neighboring project paths were not changed outside their explicit scope."
      - "Confirm each changed file contributes directly to an accepted invariant or seam proof."
  contour.claims:
    description: "Verify each accepted contract claim is implemented and supported by production-seam evidence."
    criteria:
      - "Trace every invariant and acceptance criterion to the production code path that enforces it."
      - "Inspect the named seam test and confirm it reaches real storage, engine, CLI, or delivery behavior rather than a substitute implementation."
      - "Check that failure cases reject malformed or missing evidence and that diagnostics identify the violated contract."
  contour.concurrency:
    description: "Verify concurrent operations cannot admit stale authority, lose receipts, or publish partial task state."
    criteria:
      - "Check transaction boundaries, revision fencing, claim ownership, and candidate baseline comparisons under competing updates."
      - "Verify rollback restores the prior task and receipt state after a failed filesystem or Git operation."
      - "Ensure lock ordering and shared-database operations cannot deadlock or cross task namespaces."
  contour.project_isolation:
    description: "Verify task data, profiles, paths, and Git operations stay within the owning workspace and project."
    criteria:
      - "Confirm workspace resolution uses the active repository root and ignores profile configuration from linked workspaces."
      - "Check task identifiers, milestone paths, database rows, and profile paths are confined to their configured repository and project."
      - "Verify symlinks, traversal segments, and malformed paths fail closed before mutation."
  contour.administration:
    description: "Verify protected configuration, migration, profile pins, and privileged delivery behavior remain governed."
    criteria:
      - "Check schema migrations are atomic, one-time, and do not alter unrelated blackboard topics or archived historical receipts."
      - "Verify profile hashes and compiled gate references fail closed on tampering or unresolved names."
      - "Confirm Git hooks run, candidate commits retain the validated parent, and receipts record the landed task SHA."
  milestone.synthesis:
    description: "MANDATORY ARCHITECTURAL AUDIT & CONTRACT SYNTHESIS GATE — DO NOT BYPASS"
    criteria:
      - "NO DEAD RE-EXPORT SHIMS: Do not retain pub mod wrappers when pub use crate_name::module; suffices."
      - "CRATE EXTRACTION CLEANUP: Check git status and module-tree reachability after extraction; delete orphaned source files inside admitted scope."
      - "AST SEARCH LANGUAGE: Always supply language to ast_grep_search when path is omitted or has no file extension, including directory paths."
      - "REVIEW REJECTION BOUNDARY: Reject only for contract failure, scope violation, invariant breach, or a genuine functional or architectural defect. Never reject over doc-comment wording or non-regression stylistic nitpicks."
      - "ARCHITECTURAL EXTENSION POINTS: Inspect existing subsystem registries, public interfaces, and data flow using semantic tools and source reading. Identify natural extension seams and data flow. Do NOT invent parallel systems or touch protected repository files."
      - "FORMAL ARCHITECTURAL BLUEPRINT: Synthesize an architectural decision covering type invariants, data flow, error states, and impact perimeters."
      - "DOMAIN SEAM TEST: Author a compiling runtime-red seam test in the appropriate domain test module proving the unfulfilled contract. Use dedicated test functions with descriptive names."
      - "RECORD ARCHITECTURAL DECISION: Before submitting this gate, record an explicit synthesis decision detailing the chosen implementation path."
      - "ANTI-AUTOPILOT INVARIANT: Do NOT blindly submit a failing test without completing the architectural audit and posting the decision to the blackboard."
  milestone.review:
    description: "MILESTONE INTEGRATION REVIEW & BOUNDED VERIFICATION"
    criteria:
      - "NO DEAD RE-EXPORT SHIMS: Do not retain pub mod wrappers when pub use crate_name::module; suffices."
      - "CRATE EXTRACTION CLEANUP: Check git status and module-tree reachability after extraction; delete orphaned source files inside admitted scope."
      - "AST SEARCH LANGUAGE: Always supply language to ast_grep_search when path is omitted or has no file extension, including directory paths."
      - "REVIEW REJECTION BOUNDARY: Reject only for contract failure, scope violation, invariant breach, or a genuine functional or architectural defect. Never reject over doc-comment wording or non-regression stylistic nitpicks."
      - "SYSTEM-LEVEL COHESION: Review overall milestone diff against target base for holistic architecture alignment, zero dangling abstractions, and clean module boundaries."
      - "PERFORMANCE INVARIANTS: Verify full alignment with docs/architecture/performance.md with authentic benchmark proof and no memory or latency regressions."
      - "CONSTRUCTIVE & DURABLE: Enforce authentic root-cause fixes; reject superficial workarounds or duplicate mechanisms without blocking beneficial improvements."
      - "ANALYTICAL CONTOURS: Evaluate review contours with engineering judgment as guiding recommendations rather than rigid bureaucratic checkboxes."
  milestone.polish: "Resolve integration failures or reviewer findings on the integrated milestone branch."
  milestone.doc: "Audit all milestone changes against documentation scope and reconcile documentation with live code and tests."
  milestone.handoff: "Terminal milestone delivery, capturing telemetry passport and archiving milestone."

policies:
  proof:
    command:
      require_zero_exit: true
      max_log_bytes: 65536
  review:
    independent_worker: true
    require_all_contours: true
  delivery:
    atomic_receipt: true
  default_review:
    independent_worker: true
    require_all_contours: true
    audit_extended_scope: true

gate_templates:
  build_review_cycle:
    gates:
      - id: "build"
        role: "builder"
        command: "check_full_repo"
        proof: "command"
      - id: "review"
        role: "independent_reviewer"
        policy: "default_review"
        proof: "review"
        contours: "guidance.contours"
        independent_from: "build"

gates:
  - id: "contract"
    role: "contract_author"
    tools: []
    guidance: [task.contract, hitl.pro]
    proof: "contract"
    expected_failure:
      exit_codes: [1, 101, 134]
      stderr_contains: "assertion failed"
    persistence:
      post: snapshot

  - id: "build"
    role: "builder"
    tools: []
    guidance: [task.code, hitl.pro]
    command: "rust-check-and-test"
    proof: "command"
    persistence:
      pre: snapshot
      post: snapshot

  - id: "review"
    role: "independent_reviewer"
    tools: []
    guidance: [task.review, hitl.pro]
    policy: "default_review"
    proof: "review"
    contours: "guidance.contours"
    independent_from: "build"
    reject_to: "build"
    reject_routing:
      scope: "build"
      symbols: "contract"
    persistence:
      immutable: true

  - id: "deliver"
    role: "independent_reviewer"
    guidance: [hitl.pro]
    proof: "delivery"
    receipt: true
    review_sources:
      - "review"
    independent_from: "build"
    reject_to: "build"
    persistence:
      immutable: true
      post: commit
      git_commit_note: telemetry

milestone_verification:
  id: "milestone_verification"
  gates:
    - id: "verify"
      command: "check_full_repo"
      proof: "command"
    - id: "review"
      role: "independent_reviewer"
      policy: "default_review"
      guidance: [milestone.review]
      proof: "review"
      contours: "guidance.contours"
      independent_from: "verify"
      persistence:
        immutable: true
  fallback:
    use: "build_review_cycle"
    command: "check_full_repo"
    guidance: [milestone.polish]
    max_attempts: 2
  deliver:
    proof: "delivery"
    receipt: true
    persistence:
      immutable: true
      post: commit

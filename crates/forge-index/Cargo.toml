[package]
name = "forge-index"
version = "0.5.1-alpha.2"
edition = "2021"
authors = ["Oleksii Pylypchuk <oleksii.pylypchuk@tuta.com>"]
description = "Pure Rust ContextUnity Forge AST extraction, linking, and index persistence"
license = "MIT"

[dependencies]
forge-core = { path = "../forge-core" }
rusqlite = { version = "0.31", features = ["bundled", "modern_sqlite", "hooks", "limits", "backup"] }
tree-sitter = "0.22"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["preserve_order", "float_roundtrip"] }
serde_yaml = "0.9"
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
anyhow = "1.0"
rayon = "1.10"
hashbrown = { version = "0.14", features = ["rayon", "serde"] }
indexmap = { version = "2", features = ["serde"] }
petgraph = "0.6"
zstd = "0.13"
walkdir = "2.5"
ignore = "0.4"
pulldown-cmark = { version = "0.10", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"

# Language parser dependencies
tree-sitter-html = { version = "=0.20.4", optional = true }
tree-sitter-yaml = { version = "=0.6.1", optional = true }
tree-sitter-toml-ng = { version = "=0.6.0", optional = true }
tree-sitter-python = { version = "0.21", optional = true }
tree-sitter-typescript = { version = "0.21", optional = true }
tree-sitter-javascript = { version = "0.21", optional = true }
tree-sitter-rust = { version = "0.21", optional = true }
tree-sitter-go = { version = "0.21", optional = true }
tree-sitter-java = { version = "=0.21.0", optional = true }
tree-sitter-c-sharp = { version = "=0.21.3", optional = true }
tree-sitter-kotlin = { version = "=0.3.8", optional = true }
tree-sitter-php = { version = "=0.22.8", optional = true }
tree-sitter-ruby = { version = "=0.21.0", optional = true }
tree-sitter-c = { version = "=0.21.4", optional = true }
tree-sitter-cpp = { version = "=0.22.3", optional = true }

[build-dependencies]
cc = "1.0"
sha2 = "0.10"

[features]
default = ["lang-html", "lang-yaml", "lang-toml", "lang-python", "lang-rust", "lang-typescript", "lang-vue", "lang-proto"]
all-languages = [
    "default",
    "lang-go",
    "lang-java",
    "lang-csharp",
    "lang-kotlin",
    "lang-php",
    "lang-ruby",
    "lang-c",
    "lang-cpp",
]
lang-html = ["dep:tree-sitter-html"]
lang-yaml = ["dep:tree-sitter-yaml"]
lang-toml = ["dep:tree-sitter-toml-ng"]
lang-python = ["dep:tree-sitter-python"]
lang-rust = ["dep:tree-sitter-rust"]
lang-typescript = ["dep:tree-sitter-typescript", "dep:tree-sitter-javascript"]
lang-vue = ["lang-typescript", "dep:tree-sitter-html"]
lang-proto = []
lang-go = ["dep:tree-sitter-go"]
lang-java = ["dep:tree-sitter-java"]
lang-csharp = ["dep:tree-sitter-c-sharp"]
lang-kotlin = ["dep:tree-sitter-kotlin"]
lang-php = ["dep:tree-sitter-php"]
lang-ruby = ["dep:tree-sitter-ruby"]
lang-c = ["dep:tree-sitter-c"]
lang-cpp = ["dep:tree-sitter-cpp"]

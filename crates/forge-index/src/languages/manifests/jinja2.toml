[[syntax_rules]]
id = "template-loader"
language = "python"
operation = { kind = "template_loader", package = "jinja2", module = "jinja2", environment = "Environment", loader = "FileSystemLoader", loader_keyword = "loader" }

[[syntax_rules]]
id = "template-symbols"
display = { builtin = "builtin:jinja_template" }
language = "html"
package_family = "python"
activation = [{ kind = "package", name = "jinja2" }]
operation = { kind = "template_symbols", requires_loader = true, tags = ["block", "include", "extends", "import", "from", "with", "endwith", "endblock", "if", "elif", "else", "endif", "for", "empty", "endfor", "macro", "endmacro", "set", "autoescape", "endautoescape", "filter", "endfilter", "call", "endcall", "trans", "endtrans", "raw", "endraw", "endset"], filters = ["default", "date", "length", "escape", "safe", "upper", "lower", "urlencode", "e", "selectattr", "list", "first", "last", "join", "tojson", "int", "float", "round", "sum"], libraries = [], library_routes = {} }

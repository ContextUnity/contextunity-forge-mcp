# Declarative Cargo ecosystem manifest for common third-party crates
enabled = true

# rusqlite
[[class_hierarchy_receivers]]
bases = ["rusqlite::Connection", "Connection"]
provider = "rusqlite"
members = [
    "open", "open_in_memory", "open_with_flags", "execute", "execute_batch",
    "prepare", "prepare_cached", "query_row", "query_row_and_then",
    "transaction", "unchecked_transaction", "close", "is_autocommit"
]
[class_hierarchy_receivers.returns]
open = { kind = "self" }
open_in_memory = { kind = "self" }
open_with_flags = { kind = "self" }
prepare = { kind = "receiver", base = "rusqlite::Statement" }
prepare_cached = { kind = "receiver", base = "rusqlite::Statement" }
transaction = { kind = "receiver", base = "rusqlite::Transaction" }
unchecked_transaction = { kind = "receiver", base = "rusqlite::Transaction" }

[[class_hierarchy_receivers]]
bases = ["rusqlite::Transaction", "Transaction"]
provider = "rusqlite"
members = ["execute", "execute_batch", "prepare", "prepare_cached", "query_row", "query_row_and_then", "commit", "rollback", "is_autocommit"]
[class_hierarchy_receivers.returns]
prepare = { kind = "receiver", base = "rusqlite::Statement" }
prepare_cached = { kind = "receiver", base = "rusqlite::Statement" }

[[class_hierarchy_receivers]]
bases = ["rusqlite::Statement", "Statement"]
provider = "rusqlite"
members = [
    "execute", "query", "query_map", "query_row", "query_and_then",
    "raw_bind_parameter", "parameter_count", "column_count", "column_names"
]
[class_hierarchy_receivers.returns]
query = { kind = "receiver", base = "rusqlite::Rows" }

[[class_hierarchy_receivers]]
bases = ["rusqlite::Rows", "Rows"]
provider = "rusqlite"
members = ["next"]
[class_hierarchy_receivers.returns]
next = { kind = "receiver", base = "rusqlite::Row" }

[[class_hierarchy_receivers]]

[[syntax_rules]]
id = "template-dialect"
language = "html"
operation = { kind = "template_dialect", dialect = { directory = "templates", assignment = "set", function = "macro", import = "import", from = "from", alias = "as", load = "load", include = "include", extends = "extends", scope_open = ["for", "if", "with", "block", "macro", "call", "filter", "autoescape", "trans", "raw"], scope_close = ["endfor", "endif", "endwith", "endblock", "endmacro", "endcall", "endfilter", "endautoescape", "endtrans", "endraw", "endset"] } }

[[syntax_rules]]
id = "template-symbols"
display = { builtin = "builtin:shared_template" }
language = "html"
operation = { kind = "template_symbols", requires_loader = false, tags = ["block", "include", "extends", "if", "elif", "else", "endif", "for", "endfor", "with", "endwith", "endblock"], filters = ["default", "length", "safe", "urlencode"], libraries = [], library_routes = {} }

[[syntax_rules]]
id = "http-client-python"
language = "python"
operation = { kind = "http_client_call", callee = "fetch", receivers = ["axios", "http", "client", "$", "jQuery", "requests"], methods = { get = "GET", post = "POST", put = "PUT", patch = "PATCH", delete = "DELETE", head = "HEAD", options = "OPTIONS", ajax = "ANY" }, default_method = "GET", url_key = "url", method_key = "method", relative_prefixes = ["/", "^", "api/"] }

[[syntax_rules]]
id = "http-client-javascript"
language = "javascript"
operation = { kind = "http_client_call", callee = "fetch", receivers = ["axios", "http", "client", "$", "jQuery", "requests"], methods = { get = "GET", post = "POST", put = "PUT", patch = "PATCH", delete = "DELETE", head = "HEAD", options = "OPTIONS", ajax = "ANY" }, default_method = "GET", url_key = "url", method_key = "method", relative_prefixes = ["/", "^", "api/"] }

[[syntax_rules]]
id = "route-object-javascript"
language = "javascript"
operation = { kind = "route_object", collection = "routes", path_key = "path", handler_key = "component", method = "ANY" }

[[syntax_rules]]
id = "http-client-typescript"
language = "typescript"
operation = { kind = "http_client_call", callee = "fetch", receivers = ["axios", "http", "client", "$", "jQuery", "requests"], methods = { get = "GET", post = "POST", put = "PUT", patch = "PATCH", delete = "DELETE", head = "HEAD", options = "OPTIONS", ajax = "ANY" }, default_method = "GET", url_key = "url", method_key = "method", relative_prefixes = ["/", "^", "api/"] }

[[syntax_rules]]
id = "route-object-typescript"
language = "typescript"
operation = { kind = "route_object", collection = "routes", path_key = "path", handler_key = "component", method = "ANY" }

[[syntax_rules]]
id = "literal-input-javascript"
language = "javascript"
operation = { kind = "receiver_type", receiver = { name = "HTMLInputElement", members = [], properties = { value = "string" }, callback_callees = [], generic = false, argument_factories = [{ callee = { kind = "global_member", receiver = "document", member = "createElement" }, argument = 0, literals = ["input"] }] } }

[[syntax_rules]]
id = "literal-script-javascript"
language = "javascript"
operation = { kind = "receiver_type", receiver = { name = "HTMLScriptElement", members = [], properties = { src = "string" }, callback_callees = [], generic = false, argument_factories = [{ callee = { kind = "global_member", receiver = "document", member = "createElement" }, argument = 0, literals = ["script"] }] } }

[[syntax_rules]]
id = "literal-input-typescript"
language = "typescript"
operation = { kind = "receiver_type", receiver = { name = "HTMLInputElement", members = [], properties = { value = "string" }, callback_callees = [], generic = false, argument_factories = [{ callee = { kind = "global_member", receiver = "document", member = "createElement" }, argument = 0, literals = ["input"] }] } }

[[syntax_rules]]
id = "literal-script-typescript"
language = "typescript"
operation = { kind = "receiver_type", receiver = { name = "HTMLScriptElement", members = [], properties = { src = "string" }, callback_callees = [], generic = false, argument_factories = [{ callee = { kind = "global_member", receiver = "document", member = "createElement" }, argument = 0, literals = ["script"] }] } }
